[package]
name = "aether-adapters"
description = "Aether 适配器宿主与监督器：独立进程 + JSON-RPC 线协议（设计 D5/D6）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aether-core.workspace = true
# 设计 D6/§2.2：tokio 承载适配器读写任务；tokio-util LinesCodec 帧语义。
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "process",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["codec"] }
# Framed 的 Stream/Sink 适配（已在 Cargo.lock，MIT/Apache-2.0）。
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[lints]
workspace = true
