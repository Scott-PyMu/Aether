[package]
name = "aether-control"
description = "Aether 生命周期与调度层：会话、run 串行、事件管线（设计 D2/D4）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aether-core.workspace = true
# D4：事件经 aether-store 单写队列（M1-04 journal）落盘；补读走 4 读连接池。
aether-store.workspace = true
# 归一化输入（适配器事件 JSON）与严格校验（D4）。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# D2/D4：会话 sequencer 与管线 actor 运行在核心 tokio 多线程运行时上（M1-05）。
# 仅需 rt/sync/time（运行时框架由上层提供，同 M1-04 口径）。
tokio = { version = "1", features = ["rt", "sync", "time"] }
# ULID 生成/解析（§2.2 选型表；ADR-007 决策 3 恢复为设计选型实现）。
# 精确固定 1.1.3（MIT）：复用既有 rand 0.8.8 / getrandom 0.2.17 依赖图，
# 不引入 rand 0.9+ 传递依赖；升版须走依赖评审并更新 Cargo.lock。
ulid = "=1.1.3"
# 持久化重试尝试日志（§2.2 选型表 `tracing`；ADR-007 决策 2 的 attempt=n/3 输出）。
tracing = "0.1"

[dev-dependencies]
# 集成测试用临时库文件（已在 Cargo.lock 中，MIT/Apache-2.0）。
tempfile = "3"
# 集成测试需要多线程运行时与 #[tokio::test] 宏。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# ADR-007 增量修订 1 决策 2：测试侧捕获 `tracing` 输出（attempt=n/3）
# ——仅 dev-dependency，不进入运行期依赖图（MIT/Apache-2.0）。
tracing-subscriber = { version = "0.3", features = ["registry"] }

[lints]
workspace = true
