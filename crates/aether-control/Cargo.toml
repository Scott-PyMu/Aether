[package]
name = "aether-control"
description = "Aether 生命周期与调度层：会话、run 串行、事件管线（设计 D2/D4）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aether-core.workspace = true
# D4：事件 journal 与补读经 aether-store 的写队列/读连接池（M1-04）。
aether-store.workspace = true
# M2-03：权限策略矩阵/路径校验/审批队列（纯决策层）在 aether-security；
# 本 crate 承接持久化、审计与超时巡检（编排层）。依赖方向 core → security/store → control，
# 无环、无反向依赖（AGENTS §2.1）。
aether-security.workspace = true
# 归一化输入（适配器事件 JSON）与严格校验（D4）。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# D2/D4：会话 sequencer 与管线 actor 运行在核心 tokio 多线程运行时上（M1-05）。
# 仅需 rt/sync/time（运行时框架由上层提供，同 M1-04 口径）。
tokio = { version = "1", features = ["rt", "sync", "time"] }
# M2-05/D8：会话级取消树（CancellationToken：父取消级联到全部子节点）。
# 已在 Cargo.lock（0.7.19，MIT，aether-adapters 同源版本）；default-features=false
# 仅取 sync 模块（CancellationToken），不启用 codec/rt/compat 等特性。
tokio-util = { version = "0.7", default-features = false }
# ULID 生成/解析（§2.2 选型表；ADR-007 决策 3 恢复为设计选型实现）。
# 精确固定 1.1.3（MIT）：复用既有 rand 0.8.8 / getrandom 0.2.17 依赖图，
# 不引入 rand 0.9+ 传递依赖；升版须走依赖评审并更新 Cargo.lock。
ulid = "=1.1.3"
# 持久化重试尝试日志（§2.2 选型表 `tracing`；ADR-007 决策 2 的 attempt=n/3 输出）。
tracing = "0.1"
# M2-07（D2）：核心进程 RSS 巡检采样（与 aether-adapters 同源版本 0.30.13，MIT，
# 已在 Cargo.lock；default-features=false 仅取进程内存采样，不启用磁盘/网络等特性）。
sysinfo = { version = "0.30.13", default-features = false }

[dev-dependencies]
# 集成测试用临时库文件（已在 Cargo.lock 中，MIT/Apache-2.0）。
tempfile = "3"
# 集成测试需要多线程运行时与 #[tokio::test] 宏。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# ADR-007 增量修订 1 决策 2：测试侧捕获 `tracing` 输出（attempt=n/3）
# ——仅 dev-dependency，不进入运行期依赖图（MIT/Apache-2.0）。
tracing-subscriber = { version = "0.3", features = ["registry"] }

[lints]
workspace = true
