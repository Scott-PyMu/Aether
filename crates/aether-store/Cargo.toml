[package]
name = "aether-store"
description = "Aether 存储层：SQLite + WAL + 单写任务（设计 D3）；依赖 aether-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aether-core.workspace = true
# 设计 D3：rusqlite（bundled SQLite）单文件库；M1-03 起为正式依赖（迁移框架/启动自检）。
rusqlite = { version = "0.40", features = ["bundled"] }
# 迁移 checksum（D3 评审修订 #2：迁移文件 sha256）。
sha2 = "0.10"
hex = "0.4"
# 安全模式「可读数据导出」的 JSONL 序列化（D3 失败场景应对）。
serde_json = "1.0"

[dev-dependencies]
# 测试用临时库文件（已在 Cargo.lock 中，MIT/Apache-2.0）。
tempfile = "3"

[lints]
workspace = true
