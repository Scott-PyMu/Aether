[package]
name = "aether-tauri"
description = "Aether 桌面壳：Tauri 2 命令层（薄），显示版本号（设计 D1/D7）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aether-core.workspace = true
tauri = { version = "2.11.5", features = [] }

[lints]
workspace = true

# Tauri 2：未启用该 feature 时二进制按 dev 模式加载 devUrl（localhost:5173）。
# 生产构建（cargo-dist / MSI / DMG / 归档）必须启用；见 [package.metadata.dist].features。
[features]
custom-protocol = ["tauri/custom-protocol"]

# 由 cargo-dist 的构建传递 --features custom-protocol（v0 元数据不支持 build-command）
[package.metadata.dist]
features = ["custom-protocol"]

[package.metadata.wix]
upgrade-guid = "95AA332B-77D2-44E3-AA28-F87ED2F05FF2"
path-guid = "7D7D57A5-4BB2-4D9A-BB69-535B23364E4D"
license = false
eula = false
