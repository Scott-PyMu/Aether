[package]
name = "aether-tauri"
description = "Aether 桌面壳：Tauri 2 命令层（薄），显示版本号（设计 D1/D7）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# windows-gnu 下 lib/bin 自带的测试目标无法加载 Common-Controls v6 manifest
# （tauri-build 仅对 bin 目标输出资源），`cargo test` 会在加载阶段失败。
# 因此按 Cargo 官方约定把测试统一放在 `tests/` 集成测试目标（build.rs 为其注入
# manifest 资源，见 build.rs 顶部说明）；lib/bin 不生成测试目标。
[lib]
test = false

[[bin]]
name = "aether-tauri"
path = "src/main.rs"
test = false

[build-dependencies]
# 测试目标注入 Common-Controls v6 清单资源（见 build.rs；MIT 许可，随 tauri-winres 已在依赖图内）
embed-resource = "3.0.11"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aether-core.workspace = true
# ADR-007：`health` 命令真实数据源（EventPipeline 与存储运行时）。
aether-control.workspace = true
aether-store.workspace = true
# M2-01 DoD6：`runtime_retry`/`runtime_enable` 薄适配到 M1-10 监督器（服务契约冻结于
# docs/M1-10-证据.md §6；本层只做 DTO → 服务 → Value/IpcError 映射）。
aether-adapters.workspace = true
# D3/§2.2：数据目录定位（dirs::data_dir / data_local_dir）。
dirs = "6"
# 迁移复制校验（sha256 与 aether-store 同口径；两 crate 已在 Cargo.lock）。
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
# D1 最小插件集：single-instance（T12 单实例锁）、dialog（迁移目标目录选择器）。
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.4"
# ADR-007：核心启动（StoreRuntime/EventPipeline）需 tokio 句柄；日志经 tracing（§2.2 选型）。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
tracing = "0.1"
# M2-07 DoD6（ADR-007 §5-1）：P0 运行期日志汇聚端（环形缓冲 + 文件）接线。
# `tracing-subscriber` 为 `tracing` 的官方输出端（MIT/Apache-2.0，已在 Cargo.lock，
# aether-control 经 dev-dependency 使用同版本 0.3.23）；`fmt` 提供 MakeWriter 接口。
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "ansi"] }
url = { version = "2", features = [] }

# A4 ③：HKCU\Software\Microsoft\OneDrive\Accounts\* 的 UserFolder 比对（winreg 安全封装，
# 工作区 lint 禁止 unsafe FFI；winreg 0.55 已是依赖图成员）。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# `test` feature 仅用于测试目标（MockRuntime / get_ipc_response）。
# 生产构建（cargo build）不合并 dev-dependencies 的 feature，产物不包含测试支撑。
[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
# ADR-007：health 真实接线测试的临时数据目录。
tempfile = "3"

[lints]
workspace = true

# Tauri 2：未启用该 feature 时二进制按 dev 模式加载 devUrl（localhost:5173）。
# 生产构建（cargo-dist / MSI / DMG / 归档）必须启用；见 [package.metadata.dist].features。
[features]
custom-protocol = ["tauri/custom-protocol"]

# 由 cargo-dist 的构建传递 --features custom-protocol（v0 元数据不支持 build-command）
[package.metadata.dist]
features = ["custom-protocol"]

[package.metadata.wix]
upgrade-guid = "95AA332B-77D2-44E3-AA28-F87ED2F05FF2"
path-guid = "7D7D57A5-4BB2-4D9A-BB69-535B23364E4D"
license = false
eula = false
