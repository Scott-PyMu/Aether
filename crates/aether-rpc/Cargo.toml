[package]
name = "aether-rpc"
description = "Aether JSON-RPC 2.0 / JSONL 叶子基础设施：有界帧读取、错误命名空间与 initialize 结构（ADR-029 D-029-3）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 依赖方向（AGENTS §2.1 / ADR-029 §3.3）：`aether-rpc` 为**叶子基础设施**，
# 不得依赖任何内部 crate（可被 daemon / tauri / adapters 使用）。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
