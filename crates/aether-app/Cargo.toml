[package]
name = "aether-app"
description = "Aether 应用层：transport-agnostic 命令层（dispatch/COMMANDS）、DTO、严格校验与业务编排（ADR-029 D-029-2/D-029-4）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 依赖方向（AGENTS §2.1）：aether-app 依赖 core/store/adapters/control/security；
# **不得**依赖 tauri/electron/node 或窗口/对话框实现（DoD-1：cargo tree 无 tauri/wry/webkit）。
[dependencies]
aether-core.workspace = true
aether-store.workspace = true
aether-adapters.workspace = true
aether-control.workspace = true
aether-security.workspace = true
# D3/§2.2：数据目录定位（dirs::data_dir / data_local_dir）。
dirs = "6"
# 迁移复制校验（sha256 与 aether-store 同口径）。
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# D7/ADR-029：类型清单（命令/DTO/错误的 TS 绑定由 aether-app 清单生成，M9-04）。
# 仅依赖 specta 本身（**不**引入 tauri-specta，避免把 tauri 拉入依赖图）。
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
# M3-04（ADR-003 决策 19）：真实磁盘可用空间探针（备份/导出外部路径与启动迁移共享）。
sysinfo = { version = "0.30.13", default-features = false }
# ADR-007：核心启动（StoreRuntime/EventPipeline）需 tokio 句柄。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tracing = "0.1"
# M2-07 DoD6（ADR-007 §5-1）：P0 运行期日志汇聚端（环形缓冲 + 文件）。
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "ansi"] }
# M3-04：备份/审计行的 ULID 生成（ADR-007 决策 3：生成/解析统一经 `ulid` crate）。
ulid = "=1.1.3"
# M7-06/ADR-024：供应商连通性测试（`provider_test`/`provider_models_fetch`）的 HTTPS 客户端。
# 选型与 aether-tauri 迁移期一致（ureq + rustls + 平台验证器；deny.toml 允许清单内）。
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
    "platform-verifier",
] }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
    "ring",
] }

# A4 ③：HKCU\Software\Microsoft\OneDrive\Accounts\* 的 UserFolder 比对（winreg 安全封装）。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
# ADR-007：health / 启动序列集成测试的临时数据目录。
tempfile = "3"
# M9-05：事件桥 10×50 / 故障注入集成测试需要 #[tokio::test] 宏。
tokio = { version = "1", features = ["macros"] }

[build-dependencies]
# ADR-015 §2.2#2：注册清单期望摘要表生成（见 build.rs；与运行期同版本、同 Cargo.lock）。
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
