      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Tauri Linux 系统依赖（webkit2gtk 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 安装 Linux 系统依赖（keyring/secret-service 需要 libdbus）
        run: sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: M3-10 验证（迁移/透传/能力门/重放/校验矩阵/前端/T14）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m3-10/verify-m3-10.mjs 2>&1 | tee m3-10-verify.log
      - name: M3-10 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M3-10 verify 失败输出（断言 + tail 30）"
            echo '```text'
            grep -E "panicked|assertion|left:|right:|FAIL |error\[|AssertionError" m3-10-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m3-10-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -A 20 "===== verify-m3-10 =====" m3-10-verify.log 2>/dev/null | tail -14 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m3-10-summary::$line"
          done
          grep -E "panicked|assertion|left:|right:" m3-10-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m3-10-assert::$line"
          done
          tail -4 m3-10-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m3-10-tail::$line"
          done

  # DoD3：覆盖率门禁（Rust cargo-llvm-cov + TS vitest --coverage，行覆盖 <70% 失败）
  coverage:
    name: Coverage gate (>=70% lines)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TS 覆盖率门禁（vitest --coverage，阈值 70）
        # AETHER_COVERAGE_LINES 同时被 vitest 配置（阈值）与 M3-02 滚动基准夹具消费：
        # 插桩模式下仅断言结构上界（v8 插桩放大渲染开销，计时不参与判定，M3-02 边界 7）。
        env:
          AETHER_COVERAGE_LINES: "70"
        run: pnpm -r --if-present coverage

      - name: M9-12 前端覆盖率不下降（基线 docs/M9-12-baseline）
        run: pnpm verify:m9-12

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      # M1-07：keyring（sync-secret-service）经 libdbus-sys 构建，必须安装 libdbus 开发包。
      - name: 安装 Linux 系统依赖（keyring/secret-service 需要 libdbus）
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # M1-09：构建 Mock 适配器，使 aether-adapters 一致性/健壮性集成测试参与覆盖率统计。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: 构建 Mock 适配器（M1-09 集成测试依赖）
        run: bun build packages/adapter-mock/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-mock-adapter"
      - name: Rust 覆盖率门禁（cargo-llvm-cov，行覆盖 >=70）
        # 壳层 aether-tauri 无业务逻辑，其验证为 Windows/macOS 构建+冒烟；
        # 该排除为 M1-01 常量级决策，已记录在任务证据中。
        # ADR-029 §8.2（P2-7）：M9-02～G8 期间，迁移/新增层 `aether-app`/`aether-rpc`/
        # `aether-daemon` 不计入 70% 行覆盖门禁（其覆盖以任务证据的增量数字 + Tauri
        # 删除文件清单替代；G8 恢复全量并给出对比表）。迁移前 aether-tauri 同样被排除，
        # 因此本豁免保持与 M1-01 基线相同的门禁口径；其余 crate 仍按 >=70% 强制执行。
        env:
          AETHER_MOCK_ADAPTER: ${{ runner.temp }}/aether-mock-adapter
          AETHER_REQUIRE_MOCK_ADAPTER: "1"
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --exclude aether-tauri \
            --ignore-filename-regex='(\.cargo/registry|/rustc/|(crates/)?aether-(app|rpc|daemon)/)' \
            --fail-under-lines 70 2>&1 | tee llvm-cov.log
      - name: 增量覆盖 + Tauri 删除文件清单（M9-12 / ADR-029 §8.2 P2-7）
        # 复用上一步 profdata（report 不重跑测试），对 M9-02～G8 迁移层单独归档；
        # 不改变上面的 70% 门禁口径。
        run: |
          set -o pipefail
          mkdir -p scripts/test/.tmp/m9-12/coverage
          cargo llvm-cov report --workspace --exclude aether-tauri \
            --json --summary-only \
            --output-path scripts/test/.tmp/m9-12/coverage/llvm-cov.json
          node scripts/test/m9-12/coverage-incremental.mjs \
            --report scripts/test/.tmp/m9-12/coverage/llvm-cov.json
      - name: 归档覆盖率证据（M9-12）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-12-coverage
          path: |
            llvm-cov.log
            apps/desktop/coverage/coverage-summary.json
            scripts/test/.tmp/m9-12/coverage/
          if-no-files-found: warn
          retention-days: 30
      - name: 覆盖率失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        run: |
          {
            echo "### Rust 覆盖率失败输出（FAILED/panicked + tail 30）"
            echo '```text'
            grep -E "FAILED|panicked|test result: FAILED|error\[|fail-under" llvm-cov.log 2>/dev/null | tail -20 || true
            echo '--- tail 30 ---'
            tail -30 llvm-cov.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAILED|panicked|test result: FAILED|error\[|fail-under" llvm-cov.log 2>/dev/null | tail -6 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=coverage-fail::$line"
          done
          tail -4 llvm-cov.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=coverage-tail::$line"
          done

  # DoD2：供应链门禁（依赖白名单 / 许可证 / 相似度 / SBOM）
  # 各检查步骤使用 if: !cancelled()，保证一次运行报告全部违规（不因首个失败短路）。
  supply-chain:
    name: Supply chain gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny（许可证 / 禁令 / 来源；含 advisories）
        run: cargo deny check

      - name: 相似度 / 净室合规扫描
        if: ${{ !cancelled() }}
        run: node scripts/ci/similarity-scan.mjs --root .

      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile
      - name: npm 许可证门禁
        if: ${{ !cancelled() }}
        run: pnpm check:licenses

      - name: 生成 SBOM（SPDX JSON）
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json=sbom.spdx.json --exclude ./node_modules --exclude ./target
      - name: 上传 SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

  # M7-05（ADR-008）：三运行时一致性回归门禁（bun 构建四适配器 bundle + 一致性
  # 测试包全量（三运行时 + Mock，REQUIRE=1 强制产物在用）+ 协议面回归（热插拔/
  # 路由/闸门/暂停 + 四适配器 TS 全量）+ fixture 用例）。真实冒烟为 opt-in
  # （缺凭证由 verify 输出显式 SKIP 行；详见 docs/M7-05-证据.md）。
  m7-05-consistency:
    name: Three-runtime consistency (M7-05)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: M7-05 三运行时一致性回归门禁
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m7-05/verify-m7-05.mjs 2>&1 | tee m7-05-verify.log
      - name: 失败诊断（公开 annotation）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M7-05 verify 失败（摘要 + tail 30）"
            echo '```text'
            grep -E "^FAIL|panicked|assertion|Test Files|Tests |error\[" m7-05-verify.log 2>/dev/null | tail -20 || true
            echo '--- tail 30 ---'
            tail -30 m7-05-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^FAIL " m7-05-verify.log 2>/dev/null | tail -8 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m7-05-summary::$line"
          done
          tail -4 m7-05-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m7-05-tail::$line"
          done
      - name: 归档 M7-05 证据（一致性包 + 协议面回归输出）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m7-05-evidence
          path: |
            scripts/test/.tmp/m7-05/evidence-*/
            m7-05-verify.log
          if-no-files-found: warn
          retention-days: 30

  # ===== M9-12：CI 从 Tauri 构建切到 Electron + daemon（ADR-029 §8.2） =====
  m9-12-gates:
    name: M9-12 frontend/protocol gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Linux 系统依赖（协议生成物校验需要 Tauri/keyring 构建）
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 生成物/错误码/基线（diff=0）
        run: |
          set -o pipefail
          {
            pnpm --filter @aether/protocol check
            pnpm verify:error-codes
            pnpm verify:m9-01-baseline
          } 2>&1 | tee m9-12-protocol.log
      - name: 前端测试 / 类型检查 / 构建
        run: |
          set -o pipefail
          {
            pnpm -r --workspace-concurrency=1 test
            pnpm -r --if-present typecheck
            pnpm -r --if-present build
          } 2>&1 | tee m9-12-frontend.log
      - name: M9-12 静态门禁
        run: pnpm verify:m9-12
      - name: 失败诊断
        if: failure()
        shell: bash
        run: |
          {
            echo "### M9-12 gates 失败（摘要 + tail 40）"
            echo '```text'
            grep -E "FAIL|failed|panicked|assertion|error\[|Tests " m9-12-protocol.log m9-12-frontend.log 2>/dev/null | tail -20 || true
            echo '--- tail 40 ---'
            tail -40 m9-12-protocol.log m9-12-frontend.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 归档 M9-12 前端/协议证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-12-gates
          path: |
            m9-12-protocol.log
            m9-12-frontend.log
          if-no-files-found: warn
          retention-days: 30

  m9-12-rust-gates:
    name: M9-12 Rust build/test/clippy/deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - name: 安装 Linux 系统依赖（keyring/secret-service + Tauri 对照 clippy）
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust 构建/测试（Electron 架构；Tauri 仅开发对照）
        run: |
          set -o pipefail
          {
            cargo build --workspace --exclude aether-tauri
            cargo test --workspace --exclude aether-tauri -j 1
            cargo test -p aether-daemon --test m9_12_regressions -j 1 -- --test-threads=1
          } 2>&1 | tee m9-12-rust.log
      - name: clippy（全 workspace，-D warnings）
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a m9-12-rust.log
      - name: cargo deny
        shell: bash
        run: |
          set -o pipefail
          cargo deny check 2>&1 | tee -a m9-12-rust.log
      - name: 失败诊断
        if: failure()
        shell: bash
        run: |
          {
            echo "### M9-12 Rust gates 失败（关键行 + tail 40）"
            echo '```text'
            grep -E "FAILED|panicked|assertion|error\[|warning:" m9-12-rust.log 2>/dev/null | tail -20 || true
            echo '--- tail 40 ---'
            tail -40 m9-12-rust.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 归档 M9-12 Rust 证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-12-rust
          path: m9-12-rust.log
          if-no-files-found: warn
          retention-days: 30

