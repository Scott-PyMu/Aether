      - name: DMG 挂载/复制/启动
        run: pnpm smoke:installer:macos
      - name: 归档 DMG 冒烟证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-12-installer-macos
          path: |
            dist-out/*.dmg
            dist-out/*.json
          if-no-files-found: warn
          retention-days: 30

  m9-12-linux-build-smoke:
    name: M9-12 Linux build + xvfb smoke
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-tools rpm fakeroot xvfb \
            libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 \
            libdbus-1-dev pkg-config libssl-dev build-essential
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 打包 deb + AppImage
        run: pnpm package:desktop --linux
      - name: Linux deb/AppImage xvfb 冒烟
        run: pnpm smoke:installer:linux
      - name: M9-12 静态门禁（Linux 构建范围）
        run: pnpm verify:m9-12
      - name: 归档 Linux 产物/冒烟证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-12-linux
          path: |
            dist-out/*.deb
            dist-out/*.AppImage
            dist-out/*.json
          if-no-files-found: warn
          retention-days: 30
