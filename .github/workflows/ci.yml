  # M9-13 G7：Windows 全量回归/性能/数据/覆盖率门禁。
  # macOS/Linux 的构建+冒烟由既有 m9-12-e2e-macos / m9-12-linux-build-smoke 覆盖；
  # M9-13 平台矩阵在证据文档中登记（macOS 签名密钥待申请，后续重新验证）。
  m9-13-windows:
    name: M9-13 regression/performance/data/coverage (Windows)
    runs-on: windows-2022
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
      AETHER_M9_13_REAL_DATA: ${{ github.workspace }}/dist-out/m9-13-fixture
      # G8 后 build.rs 默认读取 dist-out/runtime-bundle；M9-13 夹具由 prepare 写入
      # dist-out/m9-12-runtime-bundle，显式覆盖以保证注册清单信任锚一致。
      AETHER_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/dist-out/m9-12-runtime-bundle
    steps:
      - uses: actions/checkout@v6
      - name: 强制 LF（Windows 生成物/HEAD 基线校验）
        shell: bash
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index -a -f
          # checkout-index 在部分 Windows 工作区不会重写已存在的 CRLF 文件；
          # 对所有已跟踪文本文件做一次显式归一（二进制由 grep -I 排除）。
          git ls-files -z | xargs -0 grep -IlZ '' | xargs -0 sed -i 's/\r$//'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-deny
      - uses: ilammy/msvc-dev-cmd@v1
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建前端
        run: pnpm build:desktop
      - name: 准备 Mock runtime-bundle + 同源 aetherd
        run: pnpm prepare:m9-12:e2e
      # T5a/P1 一致性所需的适配器由上一步 `prepare:m9-12:e2e` 统一编译
      # （`dist-out/m9-12-runtime-bundle`，含 Mock；不再写入已删除的 Tauri 目录）。
      - name: 构建 test MSI（性能/安装冒烟使用）
        run: pnpm package:desktop:test
      - name: 生成 M9-13 CI 数据夹具
        run: node scripts/test/m9-13/seed-fixture.mjs --out dist-out/m9-13-fixture
      - name: M9-13 性能硬阈值
        run: pnpm m9-13:performance
      - name: M9-13 内测数据/备份恢复/安全模式/Keychain
        run: pnpm m9-13:data
      - name: M9-13 数据步骤失败诊断
        if: failure()
        shell: bash
        run: |
          {
            echo '### M9-13 data drill failure'
            echo '```json'
            cat scripts/test/.tmp/m9-13/data/data-drill.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: M9-13 全量回归 + P0/P1 映射
        run: pnpm m9-13:regression
      - name: M9-13/G8 Rust 覆盖率（全量；Tauri 已退役）
        shell: powershell
        env:
          TEMP: ${{ github.workspace }}/dist-out/tmp
          TMP: ${{ github.workspace }}/dist-out/tmp
        run: |
          New-Item -ItemType Directory -Force dist-out/tmp,scripts/test/.tmp/m9-13/coverage | Out-Null
          cargo llvm-cov --workspace --fail-under-lines 70 -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov report --json --summary-only --output-path scripts/test/.tmp/m9-13/coverage/llvm-cov.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov report --json --output-path scripts/test/.tmp/m9-13/coverage/full.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: M9-13 覆盖率对比
        run: pnpm coverage:m9-13
      - name: M9-13 G7 门禁
        run: pnpm verify:m9-13
      - name: M9-13 失败诊断（摘要）
        if: failure()
        shell: bash
        run: |
          {
            echo '### M9-13 failure summary'
            echo '```json'
            cat scripts/test/.tmp/m9-13/data/data-drill.json 2>/dev/null || true
            echo '```'
            echo '```json'
            cat scripts/test/.tmp/m9-13/regression/results.json 2>/dev/null | tail -c 4000 || true
            echo '```'
            echo '```json'
            cat scripts/test/.tmp/m9-13/coverage/coverage.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 归档 M9-13 证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-13-windows
          path: |
            docs/M9-13-证据.md
            scripts/test/.tmp/m9-13/
            scripts/test/.tmp/m9-12/coverage/
          if-no-files-found: warn
          retention-days: 30

  # M9-14 G8：默认切换/Tauri 退役/失败处理演练。
  m9-14-gate:
    name: M9-14 G8 switch/retirement/failure drill
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: G8 静态门禁（Electron 默认/无回退包/依赖树/文档）
        run: pnpm verify:m9-14
      - name: G4–G7 失败处理演练（停止发布 → 修复 → 重跑）
        run: pnpm m9-14:failure-drill
      - name: 归档 M9-14 证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-14-gate
          path: |
            docs/M9-14-证据.md
            docs/M9-14-失败处理演练报告.md
            docs/M9-Gate-G8-报告.md
            scripts/test/.tmp/m9-14/
          if-no-files-found: warn
          retention-days: 30
