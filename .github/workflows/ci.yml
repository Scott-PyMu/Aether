name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # DoD1：Linux cargo check + vite build
  linux-check:
    name: Linux cargo check + vite build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 版本一致性（单一来源）
        run: pnpm version:check
      - name: vite build
        run: pnpm -r --if-present build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Tauri Linux 系统依赖（webkit2gtk 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # M1-07：keyring（sync-secret-service）经 libdbus-sys 构建，必须安装 libdbus 开发包。
      - name: 安装 Linux 系统依赖（keyring/secret-service 需要 libdbus）
        run: sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo check
        run: cargo check --workspace

  # DoD1：Windows 构建 + 冒烟
  windows-build-smoke:
    name: Windows build + smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 构建前端（tauri-build 需要 frontendDist）
        run: pnpm -r --if-present build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建（工作区）
        run: cargo build --workspace
      - name: 冒烟（--version / --aether-diagnostics）
        run: node scripts/test/smoke-desktop.mjs

  # DoD1：macOS 构建 + 冒烟
  macos-build-smoke:
    name: macOS build + smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 构建前端（tauri-build 需要 frontendDist）
        run: pnpm -r --if-present build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建（工作区）
        run: cargo build --workspace
      - name: 冒烟（--version / --aether-diagnostics）
        run: node scripts/test/smoke-desktop.mjs

  # M1-10 DoD3：三平台适配器测试矩阵——Unix `setsid`/pgrp 与 Windows
  # Job Object/CREATE_NEW_PROCESS_GROUP 断言必须在各自 runner 上真实执行
  # （本机 Windows 只能覆盖 Windows 分支）。
  # M1-01 缺口修复：原 CI 无任何平台的 `cargo test`（仅 check/构建/覆盖率），
  # 导致 M1-10 平台断言在 Gate 1 前无三平台证据。
  adapters-platform-tests:
    name: Adapters tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # bun --compile 需要工作区依赖链接（@aether/adapter-sdk workspace:*）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # M1-09 集成测试需要真实 Mock 进程（缺失时测试会 SKIP；矩阵要求全量执行）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: 构建 Mock 适配器
        shell: bash
        run: bun build packages/adapter-mock/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-mock-adapter"

      # M2-02：首个真实适配器（Claude Code）——一致性/T5a 集成测试同样要求真实
      # 适配器进程，三平台矩阵真实执行（fake-claude 夹具为 Node 脚本，无网络/凭证）。
      - name: 构建 Claude Code 适配器（M2-02）
        shell: bash
        run: bun build packages/adapter-claude-code/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-claude-adapter"

      # M2-11 / ADR-008：Codex 与 DSH 适配器（fake-codex / fake-dsh 为 Node 夹具，无网络/凭证）。
      - name: 构建 Codex 适配器（M2-11）
        shell: bash
        run: bun build packages/adapter-codex/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-codex-adapter"

      - name: 构建 DSH 适配器（M2-11）
        shell: bash
        run: bun build packages/adapter-dsh/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-dsh-adapter"

      - name: cargo test -p aether-adapters（全量：单测 + M1-09/M1-10/M2-02/M2-11 集成 + 平台断言）
        shell: bash
        env:
          # Windows 上 bun --compile 产物自动追加 .exe。
          AETHER_MOCK_ADAPTER: ${{ runner.temp }}/aether-mock-adapter${{ runner.os == 'Windows' && '.exe' || '' }}
          AETHER_REQUIRE_MOCK_ADAPTER: "1"
          AETHER_CLAUDE_ADAPTER: ${{ runner.temp }}/aether-claude-adapter${{ runner.os == 'Windows' && '.exe' || '' }}
          AETHER_REQUIRE_CLAUDE_ADAPTER: "1"
          AETHER_CODEX_ADAPTER: ${{ runner.temp }}/aether-codex-adapter${{ runner.os == 'Windows' && '.exe' || '' }}
          AETHER_REQUIRE_CODEX_ADAPTER: "1"
          AETHER_DSH_ADAPTER: ${{ runner.temp }}/aether-dsh-adapter${{ runner.os == 'Windows' && '.exe' || '' }}
          AETHER_REQUIRE_DSH_ADAPTER: "1"
        run: |
          set -o pipefail
          cargo test -p aether-adapters --no-fail-fast 2>&1 | tee adapters-test.log

      - name: 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### aether-adapters 测试失败（关键行 + tail 40）"
            echo '```text'
            grep -E "FAILED|panicked|assertion|test result: FAILED|---- .* stdout" adapters-test.log 2>/dev/null | tail -20 || true
            echo '--- tail 40 ---'
            tail -40 adapters-test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAILED|panicked|assertion|test result: FAILED|---- .* stdout" adapters-test.log 2>/dev/null | tail -12 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=adapters-test::$line"
          done
          tail -6 adapters-test.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=adapters-tail::$line"
          done

      - name: 平台机制证据（M1-10 DoD3：setsid/pgrp 与 Job Object 机制序列）
        shell: bash
        run: cargo test -p aether-adapters --test m1_10_termination -- --nocapture

  # M1-08：Tauri 壳与安全基线（CSP 真实阻断、外链导航拦截、IPC 参数校验矩阵、
  # capabilities 最小 allowlist、devtools 仅 debug）——E2E 需要真实 WebView2。
  security-baseline:
    name: Tauri security baseline (M1-08)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # M2-09 步骤以 Bun 编译 Mock 适配器（windows-2022 镜像不含 Bun；与 M1-09 /
      # adapters 矩阵同版本钉扎，避免依赖 runner 预装版本导致构建失败）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: M1-08 验证（单测矩阵 + 静态检查 + CSP/导航 E2E）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m1-08/verify-m1-08.mjs 2>&1 | tee m1-08-verify.log
      - name: 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M1-08 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|IpcError|assertion|应命中|left:|right:|FAIL " m1-08-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m1-08-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 汇总表优先输出（GitHub 每步有 error annotation 上限，先发最高价值信息）
          grep -A 30 "===== verify-m1-08 =====" m1-08-verify.log 2>/dev/null | tail -20 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-08-summary::$line"
          done
          grep -E "panicked|IpcError|assertion|应命中|left:|right:|超时" m1-08-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-08-assert::$line"
          done
          tail -4 m1-08-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-08-tail::$line"
          done

      # M2 批 1（M2-01 生命周期/run 串行 + M2-03 权限网关）：
      # 复用本 job 已编译的壳层测试（runtime_retry/enable IPC 接线 + 状态转移断言）。
      - name: M2 批 1 验证（M2-01 生命周期/run 串行 ∥ M2-03 权限网关）
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/test/m2-01/verify-m2-01.mjs
            node scripts/test/m2-03/verify-m2-03.mjs
          } 2>&1 | tee m2-batch1-verify.log
      - name: M2 批 1 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M2 批 1 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|assertion|left:|right:|FAIL |error\[" m2-batch1-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m2-batch1-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^FAIL |FAIL " m2-batch1-verify.log 2>/dev/null | tail -6 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-batch1-summary::$line"
          done
          grep -E "panicked|assertion|left:|right:" m2-batch1-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-batch1-assert::$line"
          done
          tail -4 m2-batch1-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-batch1-tail::$line"
          done

      # M2 批 2（M2-04 背压分级与 journal 补读）：控制层 L2/L3/慢订阅者/Lagged/存储侧
      # 背压例外 + M1-10 监督器 isolate/release + 组合层 IsolationSink 桥接（本 job 为
      # Windows 宿主，夹具由 verify 脚本内构建并注入）。
      - name: M2 批 2 验证（M2-04 背压分级与 journal 补读）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m2-04/verify-m2-04.mjs 2>&1 | tee m2-batch2-verify.log
      - name: M2 批 2 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M2 批 2 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|assertion|left:|right:|FAIL |error\[" m2-batch2-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m2-batch2-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^FAIL |FAIL " m2-batch2-verify.log 2>/dev/null | tail -6 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-batch2-summary::$line"
          done
          grep -E "panicked|assertion|left:|right:" m2-batch2-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-batch2-assert::$line"
          done
          tail -4 m2-batch2-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-batch2-tail::$line"
          done

      # M2 批 2（M2-05 取消树与看门狗）：控制/存储层用例跨平台，Windows 宿主执行。
      - name: M2 批 2 验证（M2-05 取消树与看门狗）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m2-05/verify-m2-05.mjs 2>&1 | tee m2-05-verify.log
      - name: M2 批 2 失败诊断（M2-05）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M2-05 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|assertion|left:|right:|FAIL |error\[" m2-05-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m2-05-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^FAIL |FAIL " m2-05-verify.log 2>/dev/null | tail -6 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-05-summary::$line"
          done
          grep -E "panicked|assertion|left:|right:" m2-05-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-05-assert::$line"
          done
          tail -4 m2-05-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-05-tail::$line"
          done

      # M2 批 2（M2-06 关闭序列与 checkpoint 纪律）：存储/控制层用例跨平台，Windows 宿主执行
      # （含平台文件语义断言：关停后库文件可重命名/删除 = 无残留句柄）。
      - name: M2 批 2 验证（M2-06 关闭序列与 checkpoint 纪律）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m2-06/verify-m2-06.mjs 2>&1 | tee m2-06-verify.log
      - name: M2 批 2 失败诊断（M2-06）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M2-06 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|assertion|left:|right:|FAIL |error\[" m2-06-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m2-06-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^FAIL |FAIL " m2-06-verify.log 2>/dev/null | tail -6 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-06-summary::$line"
          done
          grep -E "panicked|assertion|left:|right:" m2-06-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-06-assert::$line"
          done
          tail -4 m2-06-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-06-tail::$line"
          done

      # M2 批 2（M2-07 panic 隔离与健康巡检）：JoinSet/JoinError panic 隔离、RSS 巡检与
      # delta 限流、运行期日志汇聚端（attempt=n/3 + persist_degraded）、UI health 5s/15s
      # 两态 E2E（真实 WebView2 + 损坏库夹具驱动 persist_degraded）。
      - name: M2 批 2 验证（M2-07 panic 隔离与健康巡检）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m2-07/verify-m2-07.mjs 2>&1 | tee m2-07-verify.log
      - name: M2 批 2 失败诊断（M2-07）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M2-07 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|assertion|left:|right:|FAIL |error\[" m2-07-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m2-07-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^FAIL |FAIL " m2-07-verify.log 2>/dev/null | tail -6 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-07-summary::$line"
          done
          grep -E "panicked|assertion|left:|right:" m2-07-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-07-assert::$line"
          done
          tail -4 m2-07-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-07-tail::$line"
          done

      # M2 批 2（M2-09 大行与 OOM 防护）：>2MiB 任意行不缓冲断连记错、1–2MiB 非引用行
      # 正常解析（内存曲线断言受控，真实 Mock + 核心侧 RSS 采样）；artifact_ref 大附件
      # 引用流（附件仅存 artifacts 路径、数据体不进入线协议、路径逃逸/形状非法拒绝）；
      # 1.5GiB 真实压力注入 → core_rss_alert/core_rss_throttle 落盘 → delta 限流 →
      # 释放回落且不崩溃（与 M2-07 同一 ResourcePatrol + AETHER_TEST_RSS_* 钩子）。
      # 注意：m2_09_oom 需 ~1.5GiB 内存（windows-2022 7GB 满足）。
      - name: M2 批 2 验证（M2-09 大行与 OOM 防护）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m2-09/verify-m2-09.mjs 2>&1 | tee m2-09-verify.log
      - name: M2 批 2 失败诊断（M2-09）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M2-09 verify 失败输出（断言细节 + head 20 + tail 30）"
            echo '```text'
            grep -E "panicked|assertion|left:|right:|FAIL |error\[" m2-09-verify.log 2>/dev/null | tail -12 || true
            echo '--- head 20（含工具链/构建错误，如 Bun 缺失）---'
            head -20 m2-09-verify.log 2>/dev/null || true
            echo '--- tail 30 ---'
            tail -30 m2-09-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 构建/工具链错误优先（GitHub 每步仅保留前 10 条 annotation）。
          grep -E "not recognized|不是内部或外部命令|ENOENT|Cannot find|\[exec\] 无法执行" m2-09-verify.log 2>/dev/null | head -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-09-build::$line"
          done
          grep -E "^FAIL |FAIL " m2-09-verify.log 2>/dev/null | tail -6 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-09-summary::$line"
          done
          grep -E "panicked|assertion|left:|right:" m2-09-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-09-assert::$line"
          done
          tail -4 m2-09-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m2-09-tail::$line"
          done

  # M1-09：线协议骨架与 Mock 适配器（D6/评审#6）——Bun 编译 Mock 单文件后，
  # 一致性/健壮性集成测试与吞吐基准均针对真实进程执行。
  wire-protocol-mock:
    name: Wire protocol + Mock adapter (M1-09)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          # 边界 B4 需读取 M1-09 基线提交的 process.rs（scripts/test/m1-09/verify-m1-09.mjs）。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: M1-09 验证（编译 Mock + 单测 + 一致性/健壮性集成 + 吞吐基准）
        run: pnpm verify:m1-09

      # M2 批 4（M2-10 权限回环）：真实 Mock 进程 + 真实权限网关（策略/审批/超时/审计）
      # + 探针零直通断言；与 M1-09 共用 Bun 构建的 Mock 单文件宿主。
      - name: M2-10 验证（权限回环：基础回环零直通 + 异常路径 + 证据归档）
        run: pnpm verify:m2-10

  # M1-06：数据目录检测/迁移流/单实例（A4/评审#9）——T13/T12 E2E 需要真实 WebView2。
  data-dir-guard:
    name: Data dir guard (M1-06)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: M1-06 验证（Win 三类样本 + 20 对照样本 + 拒绝启动/迁移/单实例 E2E）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m1-06/verify-m1-06.mjs 2>&1 | tee m1-06-verify.log
      - name: 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M1-06 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|IpcError|assertion|应命中|left:|right:|FAIL " m1-06-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m1-06-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 失败明细最高优先（GitHub 每步有 error annotation 上限）：先发 failed-check
          # 与 E2E 超时/错误细节，再发汇总表 FAIL 行与日志 tail。
          grep -E "failed-check|等待超时|E2E 执行" m1-06-verify.log 2>/dev/null | head -12 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-detail::$line"
          done
          grep -B 1 -A 6 "failed-check" m1-06-verify.log 2>/dev/null | tail -12 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-context::$line"
          done
          grep -E "^FAIL |FAIL " m1-06-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-summary::$line"
          done
          tail -4 m1-06-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-tail::$line"
          done

  # M1-06 DoD2：macOS 两类样本（mac runner 执行；iCloud 为风险条款允许的
  # 路径前缀降级实现，精度限制在 UI/报告中明示）。样本由
  # scripts/test/macos_sync_samples.sh 构造；验证器归档 Gate 1 证据并以
  # artifact `m1-06-macos-evidence` 上传（CI 日志 + 测试输出 + 样本清单）。
  data-dir-guard-macos:
    name: macOS data dir samples (M1-06)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 构建前端（tauri generate_context 需要 frontendDist）
        run: pnpm -r --if-present build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: macOS 两类样本 + 降级精度提示（DoD2）
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/m1-06/verify-m1-06-macos.mjs 2>&1 | tee m1-06-macos-verify.log
      - name: 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M1-06 macOS verify 失败输出（关键行 + tail 30）"
            echo '```text'
            grep -E "FAIL|失败|panicked|error:|Error|超时|timeout" m1-06-macos-verify.log 2>/dev/null | tail -20 || true
            echo '--- tail 30 ---'
            tail -30 m1-06-macos-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 关键行优先输出：GitHub 每步仅保留前 10 条 error annotation
          grep -E "FAIL|失败|panicked|error:|Error|超时|timeout" m1-06-macos-verify.log 2>/dev/null | tail -10 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-macos-fail::$line"
          done
          tail -8 m1-06-macos-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-macos-tail::$line"
          done

      - name: 归档 Gate 1 证据（CI 日志与测试输出）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-06-macos-evidence
          path: scripts/test/.tmp/m1-06-macos/
          if-no-files-found: warn
          retention-days: 30

  # DoD3：覆盖率门禁（Rust cargo-llvm-cov + TS vitest --coverage，行覆盖 <70% 失败）
  coverage:
    name: Coverage gate (>=70% lines)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TS 覆盖率门禁（vitest --coverage，阈值 70）
        run: pnpm -r --if-present coverage

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      # M1-07：keyring（sync-secret-service）经 libdbus-sys 构建，必须安装 libdbus 开发包。
      - name: 安装 Linux 系统依赖（keyring/secret-service 需要 libdbus）
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # M1-09：构建 Mock 适配器，使 aether-adapters 一致性/健壮性集成测试参与覆盖率统计。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: 构建 Mock 适配器（M1-09 集成测试依赖）
        run: bun build packages/adapter-mock/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-mock-adapter"
      - name: Rust 覆盖率门禁（cargo-llvm-cov，行覆盖 >=70）
        # 壳层 aether-tauri 无业务逻辑，其验证为 Windows/macOS 构建+冒烟；
        # 该排除为 M1-01 常量级决策，已记录在任务证据中。
        env:
          AETHER_MOCK_ADAPTER: ${{ runner.temp }}/aether-mock-adapter
          AETHER_REQUIRE_MOCK_ADAPTER: "1"
        run: cargo llvm-cov --workspace --exclude aether-tauri --fail-under-lines 70

  # DoD2：供应链门禁（依赖白名单 / 许可证 / 相似度 / SBOM）
  # 各检查步骤使用 if: !cancelled()，保证一次运行报告全部违规（不因首个失败短路）。
  supply-chain:
    name: Supply chain gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny（许可证 / 禁令 / 来源；含 advisories）
        run: cargo deny check

      - name: 相似度 / 净室合规扫描
        if: ${{ !cancelled() }}
        run: node scripts/ci/similarity-scan.mjs --root .

      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile
      - name: npm 许可证门禁
        if: ${{ !cancelled() }}
        run: pnpm check:licenses

      - name: 生成 SBOM（SPDX JSON）
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json=sbom.spdx.json --exclude ./node_modules --exclude ./target
      - name: 上传 SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30
