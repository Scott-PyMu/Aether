name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # DoD1：Linux cargo check + vite build
  linux-check:
    name: Linux cargo check + vite build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 版本一致性（单一来源）
        run: pnpm version:check
      - name: vite build
        run: pnpm -r --if-present build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # M1-07：keyring（sync-secret-service）经 libdbus-sys 构建，必须安装 libdbus 开发包。
      - name: 安装 Linux 系统依赖（keyring/secret-service 需要 libdbus）
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      # M9-14/G8：Tauri 已退役；默认 workspace 不再包含壳层 crate。
      - name: cargo check
        run: cargo check --workspace

  adapters-platform-tests:
    name: Adapters tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # bun --compile 需要工作区依赖链接（@aether/adapter-sdk workspace:*）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # M1-09 集成测试需要真实 Mock 进程（缺失时测试会 SKIP；矩阵要求全量执行）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: 构建 Mock 适配器
        shell: bash
        run: bun build packages/adapter-mock/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-mock-adapter"

      # M2-02：首个真实适配器（Claude Code）——一致性/T5a 集成测试同样要求真实
      # 适配器进程，三平台矩阵真实执行（fake-claude 夹具为 Node 脚本，无网络/凭证）。
      - name: 构建 Claude Code 适配器（M2-02）
        shell: bash
        run: bun build packages/adapter-claude-code/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-claude-adapter"

      # M2-11 / ADR-008：Codex 与 DSH 适配器（fake-codex / fake-dsh 为 Node 夹具，无网络/凭证）。
      - name: 构建 Codex 适配器（M2-11）
        shell: bash
        run: bun build packages/adapter-codex/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-codex-adapter"

      - name: 构建 DSH 适配器（M2-11）
        shell: bash
        run: bun build packages/adapter-dsh/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-dsh-adapter"

      - name: cargo test -p aether-adapters（全量：单测 + M1-09/M1-10/M2-02/M2-11 集成 + 平台断言）
        shell: bash
        env:
          # Windows 上 bun --compile 产物自动追加 .exe。
          AETHER_MOCK_ADAPTER: ${{ runner.temp }}/aether-mock-adapter${{ runner.os == 'Windows' && '.exe' || '' }}
          AETHER_REQUIRE_MOCK_ADAPTER: "1"
          AETHER_CLAUDE_ADAPTER: ${{ runner.temp }}/aether-claude-adapter${{ runner.os == 'Windows' && '.exe' || '' }}
          AETHER_REQUIRE_CLAUDE_ADAPTER: "1"
          AETHER_CODEX_ADAPTER: ${{ runner.temp }}/aether-codex-adapter${{ runner.os == 'Windows' && '.exe' || '' }}
          AETHER_REQUIRE_CODEX_ADAPTER: "1"
          AETHER_DSH_ADAPTER: ${{ runner.temp }}/aether-dsh-adapter${{ runner.os == 'Windows' && '.exe' || '' }}
          AETHER_REQUIRE_DSH_ADAPTER: "1"
        run: |
          set -o pipefail
          cargo test -p aether-adapters --no-fail-fast 2>&1 | tee adapters-test.log

      - name: 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### aether-adapters 测试失败（关键行 + tail 40）"
            echo '```text'
            grep -E "FAILED|panicked|assertion|test result: FAILED|---- .* stdout" adapters-test.log 2>/dev/null | tail -20 || true
            echo '--- tail 40 ---'
            tail -40 adapters-test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAILED|panicked|assertion|test result: FAILED|---- .* stdout" adapters-test.log 2>/dev/null | tail -12 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=adapters-test::$line"
          done
          tail -6 adapters-test.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=adapters-tail::$line"
          done

      - name: 平台机制证据（M1-10 DoD3：setsid/pgrp 与 Job Object 机制序列）
        shell: bash
        run: cargo test -p aether-adapters --test m1_10_termination -- --nocapture

  # M1-08：Tauri 壳与安全基线（CSP 真实阻断、外链导航拦截、IPC 参数校验矩阵、
  # capabilities 最小 allowlist、devtools 仅 debug）——E2E 需要真实 WebView2。
  security-baseline:
    name: Electron security baseline (M9-10 ← M1-08)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 构建 Electron renderer/main（verify:security 需要 dist）
        run: pnpm build:desktop

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # M2-09 步骤以 Bun 编译 Mock 适配器（windows-2022 镜像不含 Bun；与 M1-09 /
      # adapters 矩阵同版本钉扎，避免依赖 runner 预装版本导致构建失败）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: M9-10 安全基线（Electron flags/CSP/导航/preload/fuses/路径，替代 M1-08 Tauri E2E）
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:security 2>&1 | tee m1-08-verify.log
      - name: 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M1-08 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|IpcError|assertion|应命中|left:|right:|FAIL " m1-08-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m1-08-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 汇总表优先输出（GitHub 每步有 error annotation 上限，先发最高价值信息）
          grep -A 30 "===== verify-m1-08 =====" m1-08-verify.log 2>/dev/null | tail -20 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-08-summary::$line"
          done
          grep -E "panicked|IpcError|assertion|应命中|left:|right:|超时" m1-08-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-08-assert::$line"
          done
          tail -4 m1-08-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-08-tail::$line"
          done

      # Tauri 时期 M2/M3-06 E2E 步骤已退役（ADR-029：Tauri 仅开发对照）；
      # 当前安全基线由 M9-10 verify:security 承担，生命周期由 M9-09 job 承担，
      # 崩溃恢复由独立 Crash recovery (M3-06) job 承担。

  wire-protocol-mock:
    name: Wire protocol + Mock adapter (M1-09)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          # 边界 B4 需读取 M1-09 基线提交的 process.rs（scripts/test/m1-09/verify-m1-09.mjs）。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: M1-09 验证（编译 Mock + 单测 + 一致性/健壮性集成 + 吞吐基准）
        run: pnpm verify:m1-09

      # M2-10 的原 Tauri 测试宿主已随 G8 退役；权限回环由 M9-06
      # （aether-app/aether-daemon 权限桥）与 M9-12 E2E（allow/deny/timeout）承接。

  # M1-06：数据目录检测/迁移流/单实例（A4/评审#9）——T13/T12 E2E 需要真实 WebView2。
  data-dir-guard:
    name: Data dir/lifecycle (M9-09 ← M1-06)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: M9-09 生命周期/数据锁（替代 M1-06 Tauri/WebView2 E2E）
        shell: bash
        run: |
          set -o pipefail
          {
            cargo test -p aether-daemon --test m9_09_lifecycle -j 1 -- --test-threads=1
            pnpm verify:m9-09
          } 2>&1 | tee m1-06-verify.log
      - name: 失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        shell: bash
        run: |
          {
            echo "### M1-06 verify 失败输出（断言细节 + tail 30）"
            echo '```text'
            grep -E "panicked|IpcError|assertion|应命中|left:|right:|FAIL " m1-06-verify.log 2>/dev/null | tail -12 || true
            echo '--- tail 30 ---'
            tail -30 m1-06-verify.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 失败明细最高优先（GitHub 每步有 error annotation 上限）：先发 failed-check
          # 与 E2E 超时/错误细节，再发汇总表 FAIL 行与日志 tail。
          grep -E "failed-check|等待超时|E2E 执行" m1-06-verify.log 2>/dev/null | head -12 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-detail::$line"
          done
          grep -B 1 -A 6 "failed-check" m1-06-verify.log 2>/dev/null | tail -12 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-context::$line"
          done
          grep -E "^FAIL |FAIL " m1-06-verify.log 2>/dev/null | tail -4 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-summary::$line"
          done
          tail -4 m1-06-verify.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=m1-06-tail::$line"
          done
  coverage:
    name: Coverage gate (>=70% lines)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TS 覆盖率门禁（vitest --coverage，阈值 70）
        # AETHER_COVERAGE_LINES 同时被 vitest 配置（阈值）与 M3-02 滚动基准夹具消费：
        # 插桩模式下仅断言结构上界（v8 插桩放大渲染开销，计时不参与判定，M3-02 边界 7）。
        env:
          AETHER_COVERAGE_LINES: "70"
        run: pnpm -r --if-present coverage

      - name: M9-12 前端覆盖率不下降（基线 docs/M9-12-baseline）
        run: pnpm verify:m9-12

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      # M1-07：keyring（sync-secret-service）经 libdbus-sys 构建，必须安装 libdbus 开发包。
      - name: 安装 Linux 系统依赖（keyring/secret-service 需要 libdbus）
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # M1-09：构建 Mock 适配器，使 aether-adapters 一致性/健壮性集成测试参与覆盖率统计。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: 构建 Mock 适配器（M1-09 集成测试依赖）
        run: bun build packages/adapter-mock/src/main.ts --compile --outfile "$RUNNER_TEMP/aether-mock-adapter"
      - name: Rust 覆盖率门禁（G8 全量；cargo-llvm-cov 行覆盖 >=70）
        # M9-14/G8：Tauri 已退役，M9-02～G8 的排除窗口结束；
        # 全 workspace（core/store/adapters/control/security/rpc/app/daemon）纳入 70% 门禁。
        env:
          AETHER_MOCK_ADAPTER: ${{ runner.temp }}/aether-mock-adapter
          AETHER_REQUIRE_MOCK_ADAPTER: "1"
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --fail-under-lines 70 2>&1 | tee llvm-cov.log
      - name: 增量覆盖 + 全量报告（M9-12/M9-13 → G8 对比）
        # 复用上一步 profdata（report 不重跑测试）；full.json 用于 G8 前后对比表。
        run: |
          set -o pipefail
          mkdir -p scripts/test/.tmp/m9-12/coverage scripts/test/.tmp/m9-13/coverage
          cargo llvm-cov report --json --summary-only \
            --output-path scripts/test/.tmp/m9-12/coverage/llvm-cov.json
          cargo llvm-cov report --json \
            --output-path scripts/test/.tmp/m9-13/coverage/full.json
          node scripts/test/m9-12/coverage-incremental.mjs \
            --report scripts/test/.tmp/m9-12/coverage/llvm-cov.json
      - name: 归档覆盖率证据（M9-12）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-12-coverage
          path: |
            llvm-cov.log
            apps/desktop/coverage/coverage-summary.json
            scripts/test/.tmp/m9-12/coverage/
            scripts/test/.tmp/m9-13/coverage/
          if-no-files-found: warn
          retention-days: 30
      - name: 覆盖率失败诊断（公开 annotation，便于无凭据取证）
        if: failure()
        run: |
          {
            echo "### Rust 覆盖率失败输出（FAILED/panicked + tail 30）"
            echo '```text'
            grep -E "FAILED|panicked|test result: FAILED|error\[|fail-under" llvm-cov.log 2>/dev/null | tail -20 || true
            echo '--- tail 30 ---'
            tail -30 llvm-cov.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAILED|panicked|test result: FAILED|error\[|fail-under" llvm-cov.log 2>/dev/null | tail -6 | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=coverage-fail::$line"
          done
          tail -4 llvm-cov.log 2>/dev/null | sed 's/%/%25/g; s/\r$//' | while IFS= read -r line; do
            echo "::error title=coverage-tail::$line"
          done

  # DoD2：供应链门禁（依赖白名单 / 许可证 / 相似度 / SBOM）
  # 各检查步骤使用 if: !cancelled()，保证一次运行报告全部违规（不因首个失败短路）。
  supply-chain:
    name: Supply chain gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny（许可证 / 禁令 / 来源；含 advisories）
        run: cargo deny check

      - name: 相似度 / 净室合规扫描
        if: ${{ !cancelled() }}
        run: node scripts/ci/similarity-scan.mjs --root .

      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile
      - name: npm 许可证门禁
        if: ${{ !cancelled() }}
        run: pnpm check:licenses

      - name: 生成 SBOM（SPDX JSON）
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json=sbom.spdx.json --exclude ./node_modules --exclude ./target
      - name: 上传 SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30
  m9-12-gates:
    name: M9-12 frontend/protocol gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Linux 系统依赖（keyring/secret-service 需要 libdbus）
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: 生成物/错误码/基线（diff=0）
        run: |
          set -o pipefail
          {
            pnpm --filter @aether/protocol check
            pnpm verify:error-codes
            pnpm verify:m9-01-baseline
          } 2>&1 | tee m9-12-protocol.log
      - name: 前端测试 / 类型检查 / 构建
        run: |
          set -o pipefail
          {
            pnpm -r --workspace-concurrency=1 test
            pnpm -r --if-present typecheck
            pnpm -r --if-present build
          } 2>&1 | tee m9-12-frontend.log
      - name: M9-12 静态门禁
        run: pnpm verify:m9-12
      - name: 失败诊断
        if: failure()
        shell: bash
        run: |
          {
            echo "### M9-12 gates 失败（摘要 + tail 40）"
            echo '```text'
            grep -E "FAIL|failed|panicked|assertion|error\[|Tests " m9-12-protocol.log m9-12-frontend.log 2>/dev/null | tail -20 || true
            echo '--- tail 40 ---'
            tail -40 m9-12-protocol.log m9-12-frontend.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 归档 M9-12 前端/协议证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-12-gates
          path: |
            m9-12-protocol.log
            m9-12-frontend.log
          if-no-files-found: warn
          retention-days: 30

  m9-12-rust-gates:
    name: M9-12 Rust build/test/clippy/deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - name: 安装 Linux 系统依赖（keyring/secret-service 需要 libdbus）
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Rust 构建/测试（Electron 架构；G8 后全量，Tauri 已退役）
        run: |
          set -o pipefail
          {
            cargo build --workspace
            cargo test --workspace -j 1
            cargo test -p aether-daemon --test m9_12_regressions -j 1 -- --test-threads=1
          } 2>&1 | tee m9-12-rust.log
      - name: clippy（全 workspace，-D warnings）
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a m9-12-rust.log
      - name: cargo deny
        shell: bash
        run: |
          set -o pipefail
          cargo deny check 2>&1 | tee -a m9-12-rust.log
      - name: 失败诊断
        if: failure()
        shell: bash
        run: |
          {
            echo "### M9-12 Rust gates 失败（关键行 + tail 40）"
            echo '```text'
            grep -E "FAILED|panicked|assertion|error\[|warning:" m9-12-rust.log 2>/dev/null | tail -20 || true
            echo '--- tail 40 ---'
            tail -40 m9-12-rust.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 归档 M9-12 Rust 证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m9-12-rust
          path: m9-12-rust.log
          if-no-files-found: warn
          retention-days: 30

  m10-03-api-cli:
    name: M10-03 HTTP/WS/CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Install Linux keyring deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build daemon + run M10-03 API/WS/CLI tests
        shell: bash
        run: |
          set -o pipefail
          cargo build -p aether-daemon 2>&1 | tee m10-03-api.log
          cargo test -p aether-daemon --test m10_03_api -j 1 -- --test-threads=1 2>&1 | tee -a m10-03-api.log
      - name: External Node consumer (fetch + WebSocket)
        shell: bash
        run: node scripts/test/m10-03/external-client.mjs 2>&1 | tee -a m10-03-api.log
      - name: Verify OpenAPI/schema + M10-03 evidence
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:api-schema 2>&1 | tee -a m10-03-api.log
          pnpm verify:m10-03 2>&1 | tee -a m10-03-api.log
      - name: Upload M10-03 log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m10-03-api-${{ matrix.os }}
          path: m10-03-api.log
          if-no-files-found: warn
          retention-days: 30

