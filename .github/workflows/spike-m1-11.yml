name: spike-m1-11

# M1-11 A1 spike 的 opt-in CI job：只允许手动触发（workflow_dispatch），
# 不进入常规 push/PR 流水线（需要真实 Runtime 密钥与外网，成本与稳定性不可控）。
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 要验证的候选
        required: true
        default: all
        type: choice
        options:
          - all
          - both
          - claude
          - codex
          - dsh
          - dsh-acp
      runs:
        description: 连续 run 次数（DoD2 默认 20）
        required: false
        default: '20'
        type: string

permissions:
  contents: read

jobs:
  spike:
    name: A1 spike (${{ inputs.candidate }} x ${{ inputs.runs }})
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      M1_11_CLAUDE_BASE_URL: ${{ secrets.SPIKE_CLAUDE_BASE_URL }}
      M1_11_CLAUDE_TOKEN: ${{ secrets.SPIKE_CLAUDE_TOKEN }}
      M1_11_CLAUDE_MODEL: ${{ secrets.SPIKE_CLAUDE_MODEL }}
      M1_11_CODEX_BASE_URL: ${{ secrets.SPIKE_CODEX_BASE_URL }}
      M1_11_CODEX_API_KEY: ${{ secrets.SPIKE_CODEX_API_KEY }}
      M1_11_CODEX_MODEL: ${{ secrets.SPIKE_CODEX_MODEL }}
      M1_11_CODEX_REASONING: low
      M1_11_DSH_API_KEY: ${{ secrets.SPIKE_DSH_API_KEY }}
      M1_11_DSH_BASE_URL: ${{ secrets.SPIKE_DSH_BASE_URL }}
      M1_11_DSH_MODEL: ${{ secrets.SPIKE_DSH_MODEL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装官方 CLI（与接入笔记记录的验证版本一致）
        run: npm install -g @openai/codex@0.145.0 @anthropic-ai/claude-code@2.1.181 @deepseek-ai/dsh@0.1.1-rc.2

      - name: 准备 Codex 独立 CODEX_HOME（密钥只进 runner 临时目录）
        if: ${{ inputs.candidate != 'claude' && inputs.candidate != 'dsh' }}
        shell: pwsh
        run: |
          if (-not $env:M1_11_CODEX_BASE_URL -or -not $env:M1_11_CODEX_API_KEY) {
            Write-Error '缺少 SPIKE_CODEX_BASE_URL / SPIKE_CODEX_API_KEY，无法验证 codex 候选'
            exit 1
          }
          $codexHome = Join-Path $env:RUNNER_TEMP 'codex-home'
          New-Item -ItemType Directory -Force -Path $codexHome | Out-Null
          $model = if ($env:M1_11_CODEX_MODEL) { $env:M1_11_CODEX_MODEL } else { 'gpt-5.5' }
          @"
          model_provider = "spike"
          model = "$model"
          model_reasoning_effort = "$env:M1_11_CODEX_REASONING"
          [model_providers.spike]
          name = "spike"
          base_url = "$env:M1_11_CODEX_BASE_URL"
          wire_api = "responses"
          env_key = "OPENAI_API_KEY"
          "@ | Set-Content -Encoding utf8 (Join-Path $codexHome 'config.toml')
          "CODEX_HOME=$codexHome" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OPENAI_API_KEY=$env:M1_11_CODEX_API_KEY" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: 校验 Claude 候选密钥存在
        if: ${{ inputs.candidate != 'codex' && inputs.candidate != 'dsh' }}
        shell: pwsh
        run: |
          if (-not $env:M1_11_CLAUDE_BASE_URL -or -not $env:M1_11_CLAUDE_TOKEN) {
            Write-Error '缺少 SPIKE_CLAUDE_BASE_URL / SPIKE_CLAUDE_TOKEN，无法验证 claude 候选'
            exit 1
          }

      - name: 准备 DSH headless profile 与 settings（密钥只进 runner 临时目录）
        if: ${{ inputs.candidate == 'dsh' || inputs.candidate == 'all' }}
        shell: pwsh
        run: |
          if (-not $env:M1_11_DSH_BASE_URL -or -not $env:M1_11_DSH_API_KEY) {
            Write-Error '缺少 SPIKE_DSH_BASE_URL / SPIKE_DSH_API_KEY，无法验证 dsh 候选'
            exit 1
          }
          $dshHome = Join-Path $env:USERPROFILE '.dsh'
          New-Item -ItemType Directory -Force -Path $dshHome | Out-Null
          $model = if ($env:M1_11_DSH_MODEL) { $env:M1_11_DSH_MODEL } else { 'deepseek-v4-pro' }
          @"
          agent-default-model:
            provider: spike
            model: $model
          llm-pi-ai:
            providers:
              spike:
                displayName: spike
                apiKeyEnv: M1_11_DSH_API_KEY
                api: openai-completions
                baseURL: $env:M1_11_DSH_BASE_URL
                models:
                  - id: $model
                    name: $model
                    contextWindow: 1024000
                    maxTokens: 128000
          "@ | Set-Content -Encoding utf8 (Join-Path $dshHome 'settings.yaml')
          @"
          version: 1
          refs:
            M1_11_DSH_API_KEY: $env:M1_11_DSH_API_KEY
          "@ | Set-Content -Encoding utf8 (Join-Path $dshHome '.credentials.yaml')
          dsh --profile headless --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            dsh plugin --profile headless add @deepseek-ai/dsh-headless
          }

      - name: 准备 DSH 官方 ACP profile（0.1.5-rc.2 隔离安装 + 隔离 DSH_HOME）
        if: ${{ inputs.candidate == 'dsh-acp' || inputs.candidate == 'all' }}
        shell: pwsh
        run: |
          if (-not $env:M1_11_DSH_BASE_URL -or -not $env:M1_11_DSH_API_KEY) {
            Write-Error '缺少 SPIKE_DSH_BASE_URL / SPIKE_DSH_API_KEY，无法验证 dsh-acp 候选'
            exit 1
          }
          $acpRoot = Join-Path $env:RUNNER_TEMP 'dsh-acp-015'
          New-Item -ItemType Directory -Force -Path $acpRoot | Out-Null
          @'
          { "name": "dsh-acp-spike", "private": true, "version": "1.0.0" }
          '@ | Set-Content -Encoding utf8 (Join-Path $acpRoot 'package.json')
          npm install --prefix $acpRoot @deepseek-ai/dsh@0.1.5-rc.2 --no-audit --no-fund

          $acpHome = Join-Path $env:RUNNER_TEMP 'dsh-acp-home'
          New-Item -ItemType Directory -Force -Path $acpHome | Out-Null
          $model = if ($env:M1_11_DSH_MODEL) { $env:M1_11_DSH_MODEL } else { 'deepseek-v4-pro' }
          @"
          agent-default-model:
            provider: spike
            model: $model
          llm-pi-ai:
            providers:
              spike:
                displayName: spike
                apiKeyEnv: M1_11_DSH_API_KEY
                api: openai-completions
                baseURL: $env:M1_11_DSH_BASE_URL
                models:
                  - id: $model
                    name: $model
                    contextWindow: 1024000
                    maxTokens: 128000
          "@ | Set-Content -Encoding utf8 (Join-Path $acpHome 'settings.yaml')
          @"
          version: 1
          refs:
            M1_11_DSH_API_KEY: $env:M1_11_DSH_API_KEY
          "@ | Set-Content -Encoding utf8 (Join-Path $acpHome '.credentials.yaml')
          "M1_11_DSH_ACP_BIN=$acpRoot\node_modules\@deepseek-ai\dsh\lib\bin.js" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "M1_11_DSH_ACP_HOME=$acpHome" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "M1_11_DSH_ACP_PROVIDER=spike" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "M1_11_DSH_ACP_MODEL=$model" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: 运行 DoD 验证（20 次 run / 对照基线 / 中断 5s / 首 token 与吞吐）
        shell: pwsh
        run: node scripts/test/m1-11/verify-m1-11.mjs --runs ${{ inputs.runs }} --candidate ${{ inputs.candidate }}

      - name: 上传证据（含逐 run JSONL 与 summary.json）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-11-evidence-${{ inputs.candidate }}
          path: scripts/test/.tmp/m1-11/
          retention-days: 30
